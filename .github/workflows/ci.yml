name: CI

on:
  push:
    branches: [main, 'module_one_sprint_*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and build executable JAR
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t my-market-app .
