name: CI

on:
  push:
    branches: [main, 'module_one_sprint_*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Все модули: генерация кода по OpenAPI, тесты (Redis поднимается в Testcontainers) и executable JAR
      - name: Run tests and build executable JARs
        run: ./mvnw -B verify

      - name: Build Docker images
        run: docker compose build
