spring.application.name=my-market-app

server.port=8080

spring.r2dbc.url=r2dbc:h2:mem:///market?options=DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.sql.init.mode=always

spring.webflux.multipart.max-in-memory-size=1MB
spring.webflux.multipart.max-disk-usage-per-part=5MB

server.error.include-message=always

market.demo-data.enabled=true

market.payment.url=http://localhost:8081
market.payment.connect-timeout=1s
market.payment.response-timeout=3s

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# Время жизни данных о товарах в кеше Redis
market.cache.ttl=2m

# Сервис платежей принимает только запросы с access-токеном сервера авторизации (Client Credentials Flow).
# Регистрация клиента «Витрина интернет-магазина» на сервере авторизации auth-server:
market.payment.client-registration-id=payment-service
spring.security.oauth2.client.registration.payment-service.provider=auth-server
spring.security.oauth2.client.registration.payment-service.client-id=market-app
spring.security.oauth2.client.registration.payment-service.client-secret=${MARKET_APP_CLIENT_SECRET:market-app-secret}
spring.security.oauth2.client.registration.payment-service.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.payment-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.payment-service.scope=payments.read,payments.write
spring.security.oauth2.client.provider.auth-server.token-uri=${AUTH_SERVER_URL:http://localhost:9000}/oauth2/token
