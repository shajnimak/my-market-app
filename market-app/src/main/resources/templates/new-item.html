<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="bg-light">
    <div class="container p-2">
        <div th:replace="~{fragments/layout :: header}"></div>
        <div class="row p-2">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Новый товар</h5>
                        <form th:action="@{/admin/items}" th:object="${form}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="title" class="form-label">Название</label>
                                <input type="text" class="form-control" th:field="*{title}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{title}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Описание</label>
                                <textarea class="form-control" rows="3" th:field="*{description}" th:errorclass="is-invalid"></textarea>
                                <div class="invalid-feedback" th:errors="*{description}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="price" class="form-label">Цена, руб.</label>
                                <input type="number" min="0" class="form-control" th:field="*{price}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="image" class="form-label">Изображение</label>
                                <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" id="image" name="image" class="form-control"
                                       th:classappend="${#fields.hasErrors('image')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{image}"></div>
                            </div>
                            <button type="submit" class="btn btn-success">Добавить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
