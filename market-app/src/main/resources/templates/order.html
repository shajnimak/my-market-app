<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="bg-light">
<div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${newOrder}">
    Поздравляем! Успешная покупка! &#128578;
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="container p-2">
    <div th:replace="~{fragments/layout :: header}"></div>
    <div class="row p-2">
        <div class="col">
            <h2 th:text="${'Заказ №'+order.id()}"></h2>
        </div>
    </div>
    <div class="row p-2" th:each="item : ${order.items()}">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <b th:text="${item.title()}"></b>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:text="${item.count()}+' шт.'"/>
                    <li class="list-group-item" th:text="${item.price()}+' руб.'"/>
                </ul>
                <div class="card-footer">
                    <b th:text="${'Сумма: '+item.count()*item.price()}+' руб.'"></b>
                </div>
            </div>
        </div>
    </div>
    <div class="row p-2">
        <div class="col">
            <h3 th:text="${'Сумма: '+order.totalSum()}+' руб.'"></h3>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
