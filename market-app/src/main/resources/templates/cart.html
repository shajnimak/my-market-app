<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="bg-light">
    <div class="container p-2">
        <div th:replace="~{fragments/layout :: header}"></div>
        <div class="row p-2" th:each="item : ${items}">
            <div class="col">
                <div class="card">
                    <img class="p-2" th:src="${'/'+item.imgPath()}" alt="Нет изображения" width="300" height="300">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${item.title()}"></h5>
                        <h5>
                            <span class="badge text-bg-success justify-content-end" th:text="${item.price()}+' руб.'"></span>
                        </h5>
                        <p class="card-text" th:text="${item.description()}"></p>
                        <form th:action="@{/cart/items}" method="post">
                            <div class="hstack gap-3">
                                <input type="hidden" name="id" th:value="${item.id()}">
                                <button type="submit" class="btn btn-outline-secondary" name="action" value="MINUS">-</button>
                                <span th:text="${item.count()}"></span>
                                <button type="submit" class="btn btn-outline-secondary" name="action" value="PLUS">+</button>
                                <button type="submit" class="btn btn-danger ms-auto bi bi-trash" name="action" value="DELETE"></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="row p-2" th:if="${!items.isEmpty()}">
            <div class="col">
                <form th:action="@{/buy}" method="post">
                    <div class="hstack gap-3">
                        <h2 th:text="'Итого: '+${total}+' руб.'"/>
                        <span class="ms-auto text-secondary" th:if="${checkout.balance() != null}"
                              th:text="'На счёте: '+${checkout.balance()}+' руб.'"></span>
                        <button class="btn btn-warning" th:classappend="${checkout.balance() == null} ? 'ms-auto'"
                                th:disabled="${!checkout.available()}">Купить</button>
                    </div>
                </form>
                <div th:switch="${checkout.status().name()}">
                    <div class="alert alert-warning mt-2" th:case="'INSUFFICIENT_FUNDS'">
                        Недостаточно средств на счёте для оплаты заказа
                    </div>
                    <div class="alert alert-danger mt-2" th:case="'PAYMENT_SERVICE_UNAVAILABLE'">
                        Сервис платежей недоступен, оформить заказ сейчас нельзя. Попробуйте позже
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
