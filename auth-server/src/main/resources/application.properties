spring.application.name=auth-server

server.port=9000

# Адрес сервера авторизации, который попадает в claim iss токенов.
# Сервер ресурсов должен знать сервер авторизации по этому же адресу (в Docker Compose — http://auth-server:9000).
spring.security.oauth2.authorizationserver.issuer=${AUTH_SERVER_ISSUER:http://localhost:9000}

# Клиент «Витрина интернет-магазина»: получает токены по Client Credentials Flow для запросов в сервис платежей.
# Секрет хранится в виде BCrypt-хеша, открытое значение market-app-secret знает только витрина.
spring.security.oauth2.authorizationserver.client.market-app.registration.client-id=market-app
spring.security.oauth2.authorizationserver.client.market-app.registration.client-secret={bcrypt}$2y$10$vNqiznjN3AY50xTNPsFPqehPdQVLFjKqTHtXm/KwkCdLTaTsn39F.
spring.security.oauth2.authorizationserver.client.market-app.registration.client-name=Витрина интернет-магазина
spring.security.oauth2.authorizationserver.client.market-app.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.market-app.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.market-app.registration.scopes=payments.read,payments.write
spring.security.oauth2.authorizationserver.client.market-app.token.access-token-format=self-contained
spring.security.oauth2.authorizationserver.client.market-app.token.access-token-time-to-live=5m

# Сервер ресурсов «Сервис платежей»: его идентификатор добавляется в aud токенов со скоупами payments.*
auth.resource-servers.payment-service.scopes=payments.read,payments.write
