spring.application.name=payment-service

server.port=8081

# Начальный баланс счёта покупателя, руб. Счёт открывается при первом обращении и хранится в памяти,
# поэтому балансы сбрасываются при перезапуске.
payment.account.initial-balance=100000
# Начальные балансы отдельных покупателей (логин витрины → сумма): у bob денег мало, чтобы показать отказ в оплате
payment.account.balances.bob=3000

# Сервер ресурсов OAuth2: токены выдаёт сервер авторизации auth-server.
# Ключи подписи берутся из его JWK Set, iss токена должен совпадать с адресом сервера авторизации,
# а aud — содержать идентификатор сервиса платежей, зарегистрированного на сервере авторизации.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVER_URL:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVER_URL:http://localhost:9000}/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.audiences=payment-service
